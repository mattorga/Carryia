[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carryia"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime deps stay in requirements.txt (pinned, shipped in the Docker image);
# dev/eval deps in requirements-dev.txt. Kept out of here to avoid double-pinning.
dependencies = []

[tool.setuptools.packages.find]
include = ["carryia*"]
